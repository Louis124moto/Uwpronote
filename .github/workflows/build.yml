name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find MSBuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
              Write-Error "vswhere.exe introuvable."
              exit 1
          }

          $msbuild = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.Component.MSBuild `
              -find "MSBuild\**\Bin\MSBuild.exe" |
              Select-Object -First 1

          if (!$msbuild) {
              Write-Error "MSBuild introuvable."
              exit 1
          }

          Write-Host "MSBuild : $msbuild"
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Check UWP build targets
        shell: powershell
        run: |
          Write-Host "Recherche des targets UWP..."

          $targets = Get-ChildItem `
              "C:\Program Files\Microsoft Visual Studio" `
              -Recurse `
              -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (!$targets) {
              Write-Error "Microsoft.Windows.UI.Xaml.CSharp.targets introuvable."
              Write-Host ""
              Write-Host "Le runner ne possède pas les outils UWP nécessaires."
              exit 1
          }

          Write-Host "Targets trouvés :"
          Write-Host $targets.FullName

      - name: Build ARM
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host " BUILD PRONOTELUMIA"
          Write-Host "=============================="

          New-Item `
              -ItemType Directory `
              -Force `
              -Path "$env:GITHUB_WORKSPACE\Packages" |
              Out-Null

          & "$env:MSBUILD_PATH" "$env:SOLUTION" `
              /p:Configuration=$env:CONFIGURATION `
              /p:Platform=$env:PLATFORM `
              /p:AppxPackageSigningEnabled=false `
              /p:AppxBundle=Never `
              /p:GenerateAppxPackageOnBuild=true `
              /p:UapAppxPackageBuildMode=SideloadOnly `
              /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\" `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Build échoué."
              exit $LASTEXITCODE
          }

      - name: Show generated files
        if: success()
        shell: powershell
        run: |
          Write-Host "Fichiers générés :"
          Get-ChildItem `
              "$env:GITHUB_WORKSPACE\Packages" `
              -Recurse |
              Select-Object FullName, Length

      - name: Upload APPX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: Packages/
          if-no-files-found: error