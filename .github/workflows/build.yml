name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les composants UWP
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installationPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC `
            -property installationPath

          if (-not $installationPath) {
            $installationPath = & $vswhere `
              -latest `
              -products * `
              -property installationPath
          }

          Write-Host "Visual Studio : $installationPath"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          & $installer modify `
            --installPath "$installationPath" `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.VC `
            --add Microsoft.VisualStudio.Component.Windows10SDK.16299 `
            --quiet `
            --norestart `
            --wait

      - name: Vérifier les targets UWP
        shell: powershell
        run: |
          Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VisualStudio" `
            -Recurse `
            -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
            -ErrorAction SilentlyContinue

        - name: Build
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe

          if (-not $msbuild) {
            Write-Error "MSBuild introuvable."
            exit 1
          }

          Write-Host "MSBuild trouvé : $msbuild"

          & $msbuild "$env:SOLUTION" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload MSIX/AppX
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: |
            Packages/**/*.appx
            Packages/**/*.msix
            Packages/**/*.appxbundle
            Packages/**/*.msixbundle