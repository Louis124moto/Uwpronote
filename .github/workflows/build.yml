name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UWP workload
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          if (!(Test-Path $installer)) {
              Write-Error "Visual Studio Installer introuvable."
              exit 1
          }

          Write-Host "Installation du support UWP..."

          & $installer modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --quiet `
            --norestart `
            --wait

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Installation UWP échouée : $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Locate MSBuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1

          if (!$msbuild) {
              Write-Error "MSBuild introuvable."
              exit 1
          }

          Write-Host "MSBuild trouvé : $msbuild"
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Verify WindowsXaml targets
        shell: powershell
        run: |
          $vsPath = Split-Path `
            (Split-Path `
              (Split-Path $env:MSBUILD_PATH -Parent) `
              -Parent) `
            -Parent

          Write-Host "VS Path : $vsPath"

          $targets = Join-Path `
            $vsPath `
            "MSBuild\Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"

          Write-Host "Recherche : $targets"

          if (!(Test-Path $targets)) {
              Write-Error "Microsoft.Windows.UI.Xaml.CSharp.targets introuvable."
              Write-Host "Contenu WindowsXaml disponible :"

              Get-ChildItem `
                "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VisualStudio" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -like "*Xaml*"
                } |
                Select-Object FullName

              exit 1
          }

          Write-Host "WindowsXaml targets trouvé."

      - name: Build
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host " BUILD PRONOTELUMIA"
          Write-Host "================================"
          Write-Host "Solution      : $env:SOLUTION"
          Write-Host "Configuration : $env:CONFIGURATION"
          Write-Host "Platform      : $env:PLATFORM"
          Write-Host "MSBuild       : $env:MSBUILD_PATH"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\Packages" |
            Out-Null

          & "$env:MSBUILD_PATH" "$env:SOLUTION" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Build échoué."
              exit $LASTEXITCODE
          }

      - name: List packages
        if: success()
        shell: powershell
        run: |
          Write-Host "Packages générés :"

          if (Test-Path "$env:GITHUB_WORKSPACE\Packages") {
              Get-ChildItem `
                "$env:GITHUB_WORKSPACE\Packages" `
                -Recurse |
                Select-Object FullName, Length
          }

      - name: Upload APPX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: Packages/
          if-no-files-found: error