name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Visual Studio UWP
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          $installationPath = & $vswhere `
            -latest `
            -products * `
            -property installationPath

          if (-not $installationPath) {
            Write-Error "Visual Studio introuvable."
            exit 1
          }

          Write-Host "Visual Studio : $installationPath"

          & $installer modify `
            --installPath "$installationPath" `
            --add Microsoft.VisualStudio.Workload.Universal `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
            --add Microsoft.VisualStudio.Component.Windows10SDK.16299 `
            --quiet `
            --norestart `
            --wait

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installation du workload UWP échouée."
            exit $LASTEXITCODE
          }

      - name: Vérifier Windows XAML
        shell: powershell
        run: |
          Write-Host "Recherche des targets Windows XAML..."

          $targets = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\2022" `
            -Recurse `
            -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
            -ErrorAction SilentlyContinue

          if (-not $targets) {
            Write-Error "Microsoft.Windows.UI.Xaml.CSharp.targets introuvable."
            exit 1
          }

          foreach ($target in $targets) {
            Write-Host "TARGET TROUVEE : $($target.FullName)"
          }

      - name: Trouver MSBuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe

          if (-not $msbuild) {
            Write-Error "MSBuild introuvable."
            exit 1
          }

          Write-Host "MSBuild : $msbuild"

          "MSBUILD_PATH=$msbuild" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build ARM
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" "$env:SOLUTION" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload AppX
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: |
            Packages/**/*.appx
            Packages/**/*.msix
            Packages/**/*.appxbundle
            Packages/**/*.msixbundle
          if-no-files-found: error