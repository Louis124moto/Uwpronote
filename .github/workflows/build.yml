name: Build UWP W10M FCU (ARM)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Configuration de MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compilation MSBuild UWP (ARM)
      run: |
        msbuild PronoteLumia.csproj /p:Configuration=Release `
                                    /p:Platform=ARM `
                                    /p:AppxPackageSigningEnabled=false `
                                    /p:UapAppxPackageBuildMode=SideloadOnly `
                                    /p:AppxBundle=Never

    - name: Consolidation du binaire dans le dossier build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\build"
        Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include *.appx, *.appxbundle | Copy-Item -Destination "${{ github.workspace }}\build" -Force

    - name: Publication de l'artefact build
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: ${{ github.workspace }}/build/
