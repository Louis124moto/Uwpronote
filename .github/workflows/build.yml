name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer les composants UWP nécessaires au projet
      - name: Installer les outils UWP
        shell: powershell
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          if (!(Test-Path $vsInstaller)) {
            Write-Error "Visual Studio Installer introuvable."
            exit 1
          }

          Write-Host "Installation des composants UWP..."

          & $vsInstaller modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.Component.Windows10SDK.18362 `
            --quiet `
            --norestart `
            --wait

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Échec de l'installation des composants UWP."
            exit $LASTEXITCODE
          }

      # Vérification du fichier XAML requis par le vieux projet UWP
      - name: Vérifier les outils UWP XAML
        shell: powershell
        run: |
          $targets = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets",
            "C:\Program Files (x86)\MSBuild\Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"
          )

          $found = $false

          foreach ($file in $targets) {
            if (Test-Path $file) {
              Write-Host "Trouvé : $file"
              $found = $true
            }
          }

          if (!$found) {
            Write-Host "Recherche approfondie..."
            Get-ChildItem `
              "C:\Program Files\Microsoft Visual Studio" `
              -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Trouvé : $($_.FullName)"
                $found = $true
              }
          }

          if (!$found) {
            Write-Error "Microsoft.Windows.UI.Xaml.CSharp.targets est toujours introuvable."
            exit 1
          }

      # Ajouter MSBuild au PATH
      - name: Configurer MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Vérifier MSBuild
        shell: powershell
        run: |
          Write-Host "MSBuild utilisé :"
          Get-Command msbuild
          msbuild -version

      # Build ARM + génération du package APPX
      - name: Build ARM
        shell: powershell
        run: |
          Write-Host "Compilation de $env:SOLUTION"
          Write-Host "Configuration : $env:CONFIGURATION"
          Write-Host "Plateforme : $env:PLATFORM"

          msbuild "$env:SOLUTION" `
            /restore `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Récupérer le package généré
      - name: Upload APPX
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: Packages/
          if-no-files-found: error