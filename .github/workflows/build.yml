name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Detect Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe introuvable."
            exit 1
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -property installationPath

          if (!$vsPath) {
            Write-Error "Visual Studio introuvable."
            exit 1
          }

          Write-Host "Visual Studio : $vsPath"

          "VS_PATH=$vsPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Verify UWP XAML tools
        shell: powershell
        run: |
          Write-Host "Recherche de Microsoft.Windows.UI.Xaml.CSharp.targets..."

          $target = Get-ChildItem `
            -Path "$env:VS_PATH" `
            -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $target) {
            Write-Host ""
            Write-Host "ERREUR : outils UWP/XAML absents."
            Write-Host ""

            Write-Host "Composants Visual Studio :"

            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

            & $vswhere `
              -latest `
              -products * `
              -property installationVersion

            exit 1
          }

          Write-Host "Outil XAML trouvé :"
          Write-Host $target.FullName

      - name: Verify MSBuild
        shell: powershell
        run: |
          Write-Host "MSBuild utilisé :"
          Get-Command msbuild

          Write-Host ""
          msbuild -version

      - name: Restore
        shell: powershell
        run: |
          msbuild "$env:SOLUTION" `
            /t:Restore `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build ARM
        shell: powershell
        run: |
          msbuild "$env:SOLUTION" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: List packages
        shell: powershell
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\Packages")) {
            Write-Error "Aucun dossier Packages généré."
            exit 1
          }

          Get-ChildItem `
            "$env:GITHUB_WORKSPACE\Packages" `
            -Recurse |
            Select-Object FullName, Length

      - name: Upload APPX
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: Packages/
          if-no-files-found: error