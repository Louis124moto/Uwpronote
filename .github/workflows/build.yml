name: Build PronoteLumia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      SOLUTION: PronoteLumia.sln
      CONFIGURATION: Release
      PLATFORM: ARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Diagnostic Visual Studio et UWP
        shell: powershell
        run: |
          Write-Host "=== Visual Studio ==="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere introuvable."
            exit 1
          }

          & $vswhere -products * -latest -format json

          Write-Host ""
          Write-Host "=== Recherche Microsoft.Windows.UI.Xaml.CSharp.targets ==="

          $roots = @(
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\MSBuild"
          )

          $targets = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              $targets += Get-ChildItem `
                -Path $root `
                -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" `
                -Recurse `
                -ErrorAction SilentlyContinue
            }
          }

          if ($targets.Count -eq 0) {
            Write-Host ""
            Write-Host "Aucun fichier Microsoft.Windows.UI.Xaml.CSharp.targets trouvé."
            Write-Host ""
            Write-Host "=== SDK Windows installés ==="

            Get-ChildItem `
              "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1
          }

          Write-Host ""
          Write-Host "Fichiers trouvés :"

          foreach ($target in $targets) {
            Write-Host $target.FullName
          }

      - name: Vérifier MSBuild
        shell: powershell
        run: |
          Write-Host "=== MSBuild ==="
          Get-Command msbuild
          msbuild -version

      - name: Build ARM
        shell: powershell
        run: |
          Write-Host "=== BUILD ==="
          Write-Host "Solution      : $env:SOLUTION"
          Write-Host "Configuration : $env:CONFIGURATION"
          Write-Host "Platform      : $env:PLATFORM"

          msbuild "$env:SOLUTION" `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\Packages\" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build échoué."
            exit $LASTEXITCODE
          }

      - name: Upload APPX
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: Packages/
          if-no-files-found: error