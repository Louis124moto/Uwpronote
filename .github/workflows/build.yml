name: Build UWP

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: nuget restore PronoteLumia.sln

      - name: Build ARM
        run: msbuild PronoteLumia.sln /p:Configuration=Release /p:Platform=ARM /p:AppxPackageSigningEnabled=false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PronoteLumia-ARM
          path: |
            **/bin/ARM/Release/**